services:
    postgres:
        image: postgres:17-alpine
        container_name: gm-table-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-gm_table}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gm_table_password}
            POSTGRES_DB: ${POSTGRES_DB:-gm_table}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - ${POSTGRES_DATA_DIR:-./docker/postgres/data}:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gm_table}"]
            interval: 5s
            timeout: 5s
            retries: 5

